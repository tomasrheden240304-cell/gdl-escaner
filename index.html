<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDL Inventario - Escáner</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; background: #f5f5f5; }
    h2 { color: #333; }
    label { font-weight: bold; font-size: 14px; }
    select, input, button { width: 100%; padding: 10px; margin: 6px 0 14px 0; font-size: 16px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #4285f4; color: white; border: none; cursor: pointer; font-weight: bold; }
    #video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 14px; min-height: 250px; object-fit: cover; }
    #resultado { padding: 12px; border-radius: 4px; margin-bottom: 14px; display: none; }
    .encontrado { background: #d4edda; color: #155724; }
    .noEncontrado { background: #f8d7da; color: #721c24; }
    #estado { text-align: center; color: #666; margin-bottom: 10px; }
    #errorCamara { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; margin-bottom: 14px; display: none; font-size: 14px; white-space: pre-wrap; }
    #mensaje { margin-top: 10px; padding: 10px; border-radius: 4px; }
    .ok { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <h2>📷 GDL Inventario — Escanear</h2>
  <p id="estado">Pidiendo acceso a la cámara...</p>

  <div id="errorCamara"></div>

  <video id="video" autoplay muted playsinline></video>

  <div id="resultado"></div>

  <div id="formulario" style="display:none;">
    <label>Producto encontrado</label>
    <input type="text" id="productoEncontrado" disabled>

    <label>Tipo de movimiento</label>
    <select id="tipo">
      <option value="Entrada">Entrada</option>
      <option value="Salida">Salida</option>
      <option value="Ajuste por conteo">Ajuste por conteo</option>
    </select>

    <label>Cantidad</label>
    <input type="number" id="cantidad" min="1" value="1">

    <button onclick="guardarMovimiento()">Guardar movimiento</button>
    <button onclick="volverAEscanear()" style="background:#888;">Escanear otro código</button>
  </div>

  <div id="mensaje"></div>

  <script>
    // ⚠️ URL de tu app de Google Apps Script (la que termina en /exec)
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyXm_4kbfUmSY-wLhTxoSQPPeX4mIyzHRUE0TIePwgWMxk0VQzS8P-Zum4KjlKJbXyTaA/exec';
    
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let escaneando = true;

    function mostrarError(mensaje) {
      const div = document.getElementById('errorCamara');
      div.textContent = '⚠ ' + mensaje;
      div.style.display = 'block';
      document.getElementById('estado').textContent = '';
    }

    function iniciarEscaneo() {
      escaneando = true;
      document.getElementById('formulario').style.display = 'none';
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('errorCamara').style.display = 'none';
      document.getElementById('estado').textContent = 'Pidiendo acceso a la cámara...';

      const constraints = { video: { facingMode: { ideal: 'environment' } } };

      codeReader.decodeFromConstraints(constraints, 'video', function (result, err) {
        if (result && escaneando) {
          escaneando = false;
          const codigo = result.getText();
          document.getElementById('estado').textContent = 'Código detectado: ' + codigo;
          codeReader.reset();
          buscarProducto(codigo);
        }
      })
      .then(function () {
        document.getElementById('estado').textContent = 'Apuntá la cámara al código de barras...';
      })
      .catch(function (err) {
        mostrarError('No se pudo acceder a la cámara.\nTipo: ' + (err.name || '') + '\nDetalle: ' + (err.message || err));
      });
    }

    function buscarProducto(codigo) {
      fetch(URL_APPS_SCRIPT + '?action=buscar&codigo=' + encodeURIComponent(codigo))
        .then(function (res) { return res.json(); })
        .then(function (res) {
          const div = document.getElementById('resultado');
          if (res.encontrado) {
            div.className = 'encontrado';
            div.innerHTML = '✔ Producto encontrado: <b>' + res.nombre + '</b>';
            div.style.display = 'block';
            document.getElementById('productoEncontrado').value = res.nombre;
            document.getElementById('formulario').style.display = 'block';
          } else {
            div.className = 'noEncontrado';
            div.innerHTML = '✖ No se encontró ningún producto con el código: ' + codigo;
            div.style.display = 'block';
            document.getElementById('formulario').style.display = 'none';
          }
        })
        .catch(function (err) {
          mostrarError('Error al buscar el producto: ' + err.message);
        });
    }

    function volverAEscanear() {
      iniciarEscaneo();
    }

    function guardarMovimiento() {
      const producto = document.getElementById('productoEncontrado').value;
      const tipo = document.getElementById('tipo').value;
      const cantidad = parseInt(document.getElementById('cantidad').value, 10);

      if (!cantidad || cantidad <= 0) {
        alert('Ingresá una cantidad válida');
        return;
      }

      document.getElementById('mensaje').innerHTML = 'Guardando...';

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'registrar',
          items: [{ producto: producto, tipo: tipo, cantidad: cantidad, observacion: '' }]
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          document.getElementById('mensaje').innerHTML = '<div class="ok">✔ Movimiento guardado</div>';
          setTimeout(function () {
            document.getElementById('mensaje').innerHTML = '';
            iniciarEscaneo();
          }, 1500);
        })
        .catch(function (err) {
          document.getElementById('mensaje').innerHTML = 'Error: ' + err.message;
        });
    }

    iniciarEscaneo();
  </script>
</body>
</html>
